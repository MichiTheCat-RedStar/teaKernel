# GitHub тестики сборки для trash/tests/test*

# [✓]/[◎]/[?]/[○]/[✗];

name: Run all tests in trash/tests/

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            nasm gcc gcc-multilib make binutils \
            xorriso grub-pc-bin qemu-system-x86

      - name: Build and run all tests
        run: |
          set -e
          FAILED=0

          for test_dir in $(find trash/tests -mindepth 1 -maxdepth 1 -type d -name "test*" | sort); do
            echo "[☭] Тестирую: $test_dir"

            # Проверяю наличие Makefile
            if [ ! -f "$test_dir/Makefile" ] && [ ! -f "$test_dir/makefile" ]; then
              echo "[?] Нет Makefile"
              continue
            fi

            # Сборка теста
            echo "Собираю..."
            (cd "$test_dir" && \
              if make -n clean 2>/dev/null; then make clean; fi && \
              make) || { echo "[✗] Ошибка сборки в $test_dir"; FAILED=1; break; }

            # Ищу собранный бинарник (каким бы он не был: ELF, BIN, IMG)
            BINARY=$(find "$test_dir" -maxdepth 1 -type f \( -name "*.elf" -o -name "*.bin" -o -name "*.img" \) | head -1)

            if [ -n "$BINARY" ]; then
              echo "Запуск в QEMU..."
              # Запускаю QEMU с найденным файлом ядра
              (cd "$test_dir" && timeout 10s qemu-system-i386 -kernel "$(basename "$BINARY")" -nographic -no-reboot -display none) || {
                EXIT=$?
                if [ $EXIT -eq 124 ]; then
                  echo "[◎] QEMU завершился с таймаута"
                else
                  echo "[✗] QEMU крашнулся в $test_dir (ошибка: $EXIT)"
                  FAILED=1
                  break
                fi
              }
            else
              echo "[?] Не найдено ELF/BIN/IMG, пропущен QEMU"
            fi

            echo "[✓] $test_dir пройден"
          done

          if [ $FAILED -eq 1 ]; then
            echo "[✗] Некие тесты провалены."
            exit 1
          else
            echo "[✓] Все тесты пройдены!"
          fi
