<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>MichiTheCat-RedStar teaKernel</title>
	<style>
		body { margin:0; background:#1e1e1e; display:flex; justify-content:center; align-items:center; height:100vh; }
		#screen { width:800px; height:600px; background:#000; border:2px solid #444; }
	</style>
</head>
<body>
	<div id="screen"></div>
	
	<script src="libv86.js"></script>
	<script>
		console.log('V86:', typeof V86);
		
		if (typeof V86 === 'undefined') {
			document.body.innerHTML = '<h1 style="color:red;">Ошибка: V86 не загружен</h1>';
		} else {
			var emulator = new V86({
				screen_container: document.getElementById("screen"),
				wasm_path: "v86.wasm", // <-- ОБЯЗАТЕЛЬНЫЙ ПАРАМЕТР
				bios: { url: "bios/seabios.bin" },
				vga_bios: { url: "bios/vgabios.bin" },
				kernel: { url: "kernel.bin" },
				memory_size: 32 * 1024 * 1024,
				autostart: true,
				boot_order: 3,
				log_level: 2,
			});
		}
	</script>
</body>
</html>
