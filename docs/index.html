<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MichiTheCat-RedStar teaKernel</title>
    <style>
        body { background: #1e1e1e; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #screen { width: 800px; height: 600px; background: black; border: 2px solid #444; }
    </style>
</head>
<body>
    <div id="screen"></div>

    <script src="libv86.js"></script>

    <script>
        console.log('Тип V86Starter:', typeof V86Starter);

        if (typeof V86Starter === 'undefined') {
            document.body.innerHTML = '<h1 style="color:red;text-align:center;">Ошибка: V86Starter не загружен!</h1>';
            throw new Error('V86Starter not defined');
        }

        var emulator = new V86Starter({
            screen_container: document.getElementById("screen"),
            bios: { url: "bios/seabios.bin" },
            vga_bios: { url: "bios/vgabios.bin" },
            kernel: { url: "kernel.bin" },
            memory_size: 32 * 1024 * 1024,
            autostart: true,
            log_level: 2,
        });
    </script>
</body>
</html>
